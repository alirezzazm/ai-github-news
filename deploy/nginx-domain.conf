# Final server block. Replace DOMAIN with the real host name, then:
#   certbot --nginx -d DOMAIN   (adds the 443 block + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    include /etc/nginx/snippets/deny-probes.conf;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml;

    location /static/ {
        proxy_pass http://127.0.0.1:4200/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
