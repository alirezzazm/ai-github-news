# Temporary server block (no domain yet): serves the app on the raw server IP over HTTP.
# Replace with deploy/nginx-domain.conf once the domain is ready.
server {
    listen 80;
    listen [::]:80;
    server_name 62.220.123.88;

    include /etc/nginx/snippets/deny-probes.conf;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
